<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Гараж культових дрифт-автомобілів: Toyota AE86, Nissan Silvia S15, Mazda RX7 та інші легенди японського автопрому.">
    <title>Гараж - DRIFT</title>
    <link rel="icon" href="sakura.png">
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts: Epilogue, Be Vietnam Pro, Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,700;0,800;0,900;1,900&family=Be+Vietnam+Pro:wght@400;500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"/>
    <!-- Material Symbols Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-tint": "#5e5e5e",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e2e2e2",
                        "primary": "#000000",
                        "background": "#f9f9f9",
                        "on-surface": "#1a1c1c",
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "unit-xs": "0.25rem",
                        "unit-xl": "4rem",
                        "gutter-panel": "1rem",
                        "unit-sm": "0.5rem",
                        "unit-md": "1rem",
                        "margin-page": "2rem",
                        "unit-lg": "2rem"
                    },
                    fontFamily: {
                        "body-md": ["Be Vietnam Pro"],
                        "headline-md": ["Epilogue"],
                        "headline-xl": ["Epilogue"],
                        "label-bold": ["Space Grotesk"]
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-background text-on-surface font-body-md overflow-x-hidden pt-24">

    <!-- ==================== Header / Навігація ==================== -->
    <header class="bg-white dark:bg-black fixed w-[calc(100%-8px)] md:w-full top-0 left-0 z-50 border-b-4 border-black dark:border-white [clip-path:polygon(0_0,100%_0,98%_100%,0_92%)] shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
        <div class="flex justify-between items-center w-full px-6 py-4 max-w-[1440px] mx-auto">

            <div class="text-4xl font-black italic tracking-widest text-black dark:text-white uppercase drop-shadow-[4px_4px_0px_rgba(0,0,0,1)] font-headline-md">
                DRIFT
            </div>

            <nav class="nav-menu hidden lg:flex gap-4">
                <a class="nav-link" href="index.html">ГОЛОВНА</a>
                <a class="nav-link" href="history.html">ІСТОРІЯ</a>
                <a class="nav-link" href="techniques.html">ТЕХНІКИ</a>
                <a class="nav-link active" href="garage.html">ГАРАЖ</a>
                <a class="nav-link" href="vocabulary.html">СЛОВНИК</a>
                <a class="nav-link" href="registration.html">РЕЄСТРАЦІЯ</a>
            </nav>

            <div class="flex items-center gap-4">
                <span class="material-symbols-outlined text-black dark:text-white cursor-pointer hover:scale-110 transition-all block lg:hidden text-3xl" id="mobile-menu-open">menu</span>
                <span class="material-symbols-outlined text-black dark:text-white cursor-pointer hover:scale-110 transition-all">directions_car</span>
                <span class="material-symbols-outlined text-black dark:text-white cursor-pointer hover:scale-110 transition-all">person</span>
            </div>
        </div>
    </header>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" id="mobile-menu-overlay">
        <span class="material-symbols-outlined absolute top-8 right-8 text-white text-4xl cursor-pointer" id="mobile-menu-close">close</span>
        <a class="mobile-nav-link" href="index.html">ГОЛОВНА</a>
        <a class="mobile-nav-link" href="history.html">ІСТОРІЯ</a>
        <a class="mobile-nav-link" href="techniques.html">ТЕХНІКИ</a>
        <a class="mobile-nav-link active" href="garage.html">ГАРАЖ</a>
        <a class="mobile-nav-link" href="vocabulary.html">СЛОВНИК</a>
        <a class="mobile-nav-link" href="registration.html">РЕЄСТРАЦІЯ</a>
    </div>

    <!-- ==================== Main Content ==================== -->
    <main class="container mx-auto px-margin-page py-10 overflow-x-hidden">
        
        <!-- Section Header -->
        <header class="mb-12 relative">
            <h1 class="text-6xl md:text-8xl font-black italic uppercase text-black dark:text-white leading-none drop-shadow-[6px_6px_0px_rgba(0,0,0,0.1)]">
                Гонщики <span class="text-error">&</span> Машини
            </h1>
            <div class="h-2 w-32 bg-error mt-4"></div>
            <p class="mt-6 text-xl text-surface-tint max-w-2xl font-medium">
                Еліта українського та світового дрифту. Потужні агрегати, унікальні профілі та історія кожного пілота.
            </p>
        </header>

        <!-- Filters (Optional but looks cool) -->
        <section class="flex flex-wrap gap-4 mb-10" aria-label="Фільтрація автомобілів">
            <button class="px-6 py-2 bg-black text-white font-label-bold uppercase tracking-widest hover:bg-error transition-colors">Всі</button>
            <button class="px-6 py-2 border-2 border-black text-black font-label-bold uppercase tracking-widest hover:bg-black hover:text-white transition-all">Професіонали</button>
            <button class="px-6 py-2 border-2 border-black text-black font-label-bold uppercase tracking-widest hover:bg-black hover:text-white transition-all">Новачки</button>
        </section>

        <!-- Garage Grid -->
        <section id="garage-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8" aria-live="polite">
            <!-- Loading State -->
            <div class="col-span-full py-20 flex flex-col items-center justify-center opacity-50">
                <span class="material-symbols-outlined animate-spin text-6xl mb-4">refresh</span>
                <p class="font-label-bold uppercase tracking-widest">Завантаження бази даних...</p>
            </div>
        </section>

    </main>

    <!-- Головний JS-файл -->
    <script src="main.js"></script>

</body>
</html>
