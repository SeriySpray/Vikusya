    <!-- Page-specific styles: manga panels -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Neucha&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f9f9f9;
            color: #000;
            font-family: 'Neucha', cursive, sans-serif;
            padding: 0; /* Прибираємо фіксований падінг, який заважав */
        }

        .manga-page {
            background-color: #fff;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            margin-bottom: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(250px, auto);
            gap: 12px;
            border: 4px solid #000;
        }

        .panel {
            position: relative;
            border: 4px solid #000;
            background-color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Стилізація зображень під чорно-білу мангу */
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(180%) brightness(90%);
            mix-blend-mode: multiply;
        }

        /* Ефект скрінтону (манга-крапочки) */
        .screentone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#000 1px, transparent 1px);
            background-size: 4px 4px;
            opacity: 0.25;
            pointer-events: none;
            z-index: 2;
        }

        /* Хмарки для тексту */
        .speech-bubble {
            position: absolute;
            background: #fff;
            border: 3px solid #000;
            padding: 15px 20px;
            border-radius: 50% / 40%;
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            line-height: 1.2;
            text-align: center;
            max-width: 85%;
            box-shadow: 4px 4px 0px #000;
            z-index: 5;
            letter-spacing: 0.5px;
        }

        .speech-bubble.square {
            border-radius: 5px;
            padding: 10px 15px;
        }

        .speech-bubble.dark {
            background: #000;
            color: #fff;
            border-color: #fff;
            box-shadow: 4px 4px 0px #fff;
        }

        /* Розміри фреймів */
        .span-1 { grid-column: span 1; }
        .span-2 { grid-column: span 2; }
        .span-3 { grid-column: span 3; }
        .span-4 { grid-column: span 4; min-height: 350px; }
        
        .row-2 { grid-row: span 2; }

        /* Позиціювання тексту */
        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; }
        .center { top: 50%; left: 50%; transform: translate(-50%, -50%); }

        @media (max-width: 768px) {
            .manga-page {
                grid-template-columns: repeat(2, 1fr);
            }
            .span-3, .span-4 { grid-column: span 2; }
        }
    </style>
</head>

        <!-- СТОРІНКА 1: Початок -->
        <article class="manga-page" aria-label="Історія дрифту: Початок">
            <!-- Фрейм 1 -->
            <figure class="panel span-4">
                <img src="https://loremflickr.com/1000/400/racecar,drift/all?lock=1" alt="Динамічна сцена дрифту на гоночній трасі з димом з-під коліс">
                <div class="screentone"></div>
                <figcaption class="speech-bubble square top-left">
                    “Ти думаєш, дрифт — це просто ефектне ковзання? Ні… це набагато старіша історія, ніж здається.”
                </figcaption>
            </figure>
            
            <!-- Фрейм 2 -->
            <figure class="panel span-2">
                <img src="https://loremflickr.com/600/400/vintagecar,track/all?lock=2" alt="Класичний гоночний автомобіль 60-х років на старій трасі">
                <div class="screentone"></div>
                <figcaption class="speech-bubble bottom-right">
                    “Ще в 60-х, у Японії, на треках з’явився чоловік на ім’я Куніміцу Такахасі. Він не намагався виглядати красиво — він просто шукав швидший спосіб пройти поворот.”
                </figcaption>
            </figure>

            <!-- Фрейм 3 -->
            <figure class="panel span-2">
                <img src="https://loremflickr.com/600/400/tire,smoke/all?lock=3" alt="Густий дим з-під шин під час різкого повороту">
                <div class="screentone"></div>
                <figcaption class="speech-bubble top-left">
                    “Він входив у віраж жорстко… занадто жорстко. Задні колеса зривалися, але замість втрати контролю він утримував машину. Це виглядало як помилка… яка працює.”
                </figcaption>
            </figure>

            <!-- Фрейм 4 -->
            <figure class="panel span-1">
                <div class="screentone"></div>
                <figcaption class="speech-bubble dark center">
                    “Ми тоді не називали це ‘дрифтом’. Для нас це було щось дивне… але ефективне.”
                </figcaption>
            </figure>

            <!-- Фрейм 5 -->
            <figure class="panel span-3">
                <img src="https://loremflickr.com/800/400/mountainroad,night/all?lock=4" alt="Нічна гірська дорога Тоге в Японії">
                <div class="screentone"></div>
                <figcaption class="speech-bubble square top-right">
                    “Потім це перекочувало з треків у гори. Тоге. Вузькі дороги, темрява і жодного місця для помилки.”
                </figcaption>
            </figure>

            <!-- Фрейм 6 -->
            <figure class="panel span-4">
                <img src="https://loremflickr.com/1000/300/drift,corner/all?lock=5" alt="Автомобіль проходить крутий поворот у заносі">
                <div class="screentone"></div>
                <figcaption class="speech-bubble bottom-left">
                    “Саме там усе стало справжнім. Без глядачів. Без правил. Тільки ти, машина і поворот.”
                </figcaption>
            </figure>
        </article>

        <!-- СТОРІНКА 2: Еволюція -->
        <article class="manga-page" aria-label="Історія дрифту: Еволюція">
            <!-- Фрейм 7 -->
            <figure class="panel span-2 row-2">
                <img src="https://loremflickr.com/500/600/racer,helmet/all?lock=6" alt="Гонщик у шоломі, зосереджений на керуванні">
                <div class="screentone"></div>
                <figcaption class="speech-bubble top-left">
                    “І тоді з’явився Кеїчі Цучія. Він не просто їздив — він відчував машину так, ніби вона была частиною нього.”
                </figcaption>
            </figure>

            <!-- Фрейм 8 -->
            <figure class="panel span-2">
                <img src="https://loremflickr.com/500/300/carracing,night/all?lock=7" alt="Нічні перегони з яскравими фарами автомобілів">
                <div class="screentone"></div>
                <figcaption class="speech-bubble bottom-right">
                    “Я пам’ятаю ті ночі… запах паленої гуми, холодне повітря і звук двигуна, що відлунював у горах.”
                </figcaption>

            <!-- Фрейм 9 -->

                <figcaption class="speech-bubble top-right">

                </figcaption>
            </figure>

            <!-- Фрейм 10 -->
            <figure class="panel span-4">
                <img src="https://loremflickr.com/1000/300/vhs,car/all?lock=9" alt="Ретро-кадр автомобіля в стилі VHS касети 80-х">
                <div class="screentone"></div>
                <figcaption class="speech-bubble square top-left">
                    “У 1987-му з’явилось відео, яке показало це світу. І раптом те, що було нашим, стало загальним.”
                </figcaption>
            </figure>

            <!-- Фрейм 11 -->
            <figure class="panel span-2">
                <div class="screentone"></div>
                <figcaption class="speech-bubble center">
                    “Люди почали копіювати стиль… але не всі розуміли суть.”
                </figcaption>
            </figure>

            <!-- Фрейм 12 -->
            <figure class="panel span-2">
                <img src="https://loremflickr.com/500/300/drifting,balance/all?lock=10" alt="Автомобіль тримає ідеальний баланс у заносі">
                <div class="screentone"></div>
                <figcaption class="speech-bubble bottom-left">
                    “Дрифт — це не про шоу. Це про контроль. Про баланс між хаосом і точністю.”
                </figcaption>

        <!-- СТОРІНКА 3: Офіційний спорт -->
        <article class="manga-page" aria-label="Історія дрифту: Офіційний спорт">
            <!-- Фрейм 13 -->
            <figure class="panel span-2">
                <img src="https://loremflickr.com/500/300/stadium,cars/all?lock=11" alt="Стадіон для дрифту з великою кількістю глядачів та спортивних авто">

            <!-- Фрейм 14 -->

                <div class="screentone"></div>
                <figcaption class="speech-bubble bottom-left">
                    “Чесно? Частина магії тоді зникла. Але натомість з’явився новий рівень.”
                </figcaption>
            </figure>

            <!-- Фрейм 15 -->
            <figure class="panel span-3">
                <img src="https://loremflickr.com/800/300/world,map,drift/all?lock=13" alt="Мапа світу, що символізує поширення дрифту">
                <div class="screentone"></div>
                <figcaption class="speech-bubble top-left">
                    “Світ підхопив це швидко. Америка, Європа… всі хотіли навчитися їхати боком.”
                </figcaption>
            </figure>

            <!-- Фрейм 16 -->
            <figure class="panel span-1">
                <div class="screentone"></div>
                <figcaption class="speech-bubble dark center">
                    “І знаєш що? У кожного виходило по-своєму.”
                </figcaption>
            </figure>

            <!-- Фрейм 17 -->
            <figure class="panel span-4">
                <img src="https://loremflickr.com/1000/400/drift,action/all?lock=14" alt="Екшн-кадр дрифту на високій швидкості">
                <div class="screentone"></div>
                <figcaption class="speech-bubble bottom-right">
                    “Але суть не змінилась. Ти заходиш у поворот… і на мить здається, що ти вже програв.”
                </figcaption>
            </figure>

            <!-- Фрейм 18 -->
            <figure class="panel span-4" style="border-width: 6px;">
                <img src="https://loremflickr.com/1000/400/speedometer/all?lock=15" alt="Спідометр, що показує критичну швидкість">
                <div class="screentone"></div>
                <figcaption class="speech-bubble square center" style="font-size: 1.5rem; padding: 25px;">
                    “І саме в цей момент ти вирішуєш — втратити все… чи взяти контроль.”
                </figcaption>
            </figure>
