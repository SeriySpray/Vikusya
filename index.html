<!DOCTYPE html>

    <link rel="icon" href="sakura.png">
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind CSS CDN -->

    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-tint": "#5e5e5e",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e2e2e2",
                        "primary": "#000000",
                        "background": "#f9f9f9",
                        "on-surface": "#1a1c1c",
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "unit-xs": "0.25rem",
                        "unit-xl": "4rem",
                        "gutter-panel": "1rem",
                        "unit-sm": "0.5rem",
                        "unit-md": "1rem",
                        "margin-page": "2rem",
                        "unit-lg": "2rem"
                    },
                    fontFamily: {
                        "body-md": ["Be Vietnam Pro"],
                        "headline-md": ["Epilogue"],
                        "headline-xl": ["Epilogue"],

    <!-- Page-specific styles: manga effects -->
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .screentone {
            background-image: radial-gradient(#000 15%, transparent 16%);
            background-size: 4px 4px;
        }
        .speed-lines {
            background: repeating-linear-gradient(90deg, #000, #000 1px, transparent 1px, transparent 40px);
            mask-image: radial-gradient(circle, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle, black 20%, transparent 80%);
        }
        .manga-panel-clip {
            clip-path: polygon(0 0, 100% 5%, 98% 95%, 2% 100%);
        }
        .manga-hero-clip {
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }
        .bubble-tail {
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }
    </style>
</head>

<body class="bg-background text-on-surface font-body-md overflow-x-hidden pt-24">

    <!-- ==================== Header / Навігація ==================== -->

    <header class="bg-white dark:bg-black fixed w-full top-0 left-0 z-50 border-b-4 border-black dark:border-white [clip-path:polygon(0_0,100%_0,98%_100%,0_92%)] shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
        <div class="flex justify-between items-center w-full px-6 py-4 max-w-[1440px] mx-auto">
            
            <div class="text-4xl font-black italic tracking-widest text-black dark:text-white uppercase drop-shadow-[4px_4px_0px_rgba(0,0,0,1)] font-headline-md">
                DRIFT
            </div>

            <nav class="nav-menu flex gap-4">
                <a class="nav-link active" href="index.html">ГОЛОВНА</a>
                <a class="nav-link" href="history.html">ІСТОРІЯ</a>
                <a class="nav-link" href="techniques.html">ТЕХНІКИ</a>
                <a class="nav-link" href="garage.html">ГАРАЖ</a>
                <a class="nav-link" href="vocabulary.html">СЛОВНИК</a>
                <a class="nav-link" href="registration.html">РЕЄСТРАЦІЯ</a>
            </nav>

            <div class="flex items-center gap-4">
                <span class="material-symbols-outlined text-black dark:text-white cursor-pointer hover:scale-110 transition-all">directions_car</span>
                <span class="material-symbols-outlined text-black dark:text-white cursor-pointer hover:scale-110 transition-all">person</span>  
            </div>
        </div>
    </header>

    <!-- ==================== Main Content ==================== -->

        <div class="fixed inset-0 speed-lines opacity-10 pointer-events-none z-0"></div>

        <section class="container mx-auto px-margin-page relative z-10">
            <div class="grid grid-cols-12 gap-gutter-panel">
                
                <div class="col-span-12 lg:col-span-8 relative group">
                    <div class="bg-black p-1 manga-panel-clip shadow-[12px_12px_0px_0px_#000]">
                        <div class="relative bg-white aspect-[4/3] overflow-hidden manga-panel-clip manga-image-container">
                            <img class="w-full h-full object-cover grayscale contrast-150 transition-transform duration-300 ease-out manga-image" alt="AE86 drifting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCZLjk48tZyUDteWDkzY58FH1H1hFvgSkCuvI9ps11pHQedbWDlTq4azkaATErVEb2bfN2fBGntKMcWfeWolKPhvOg89L_vYo4Ph3MbBQgV4qd2CkXt-USoMZJGZE4jNBo5UfMWjqlb6xOLvqaEO7i9qCea44Yvm4IhEGclLENx-L-47p6cn_4sIVZEd7iiGtQ8x9LWlPg972e8pm8dPzeEfNA_KCUigNV53RmDT4a_z0ntL66welgCzwtTfiFQBhFtpDFX_RlJzd2I"/>
                            
                            <div class="absolute inset-0 screentone opacity-20 pointer-events-none"></div>
                            
                            <div class="absolute top-10 left-10 transform -rotate-12 select-none pointer-events-none">
                                <span class="font-headline-xl text-black drop-shadow-[4px_4px_0px_#fff] uppercase">ギャアアア</span>
                                <div class="font-headline-md text-white bg-black px-4 py-1 mt-2 inline-block -skew-x-12">ВІІУУУ</div>
                            </div>
                            <div class="absolute bottom-20 right-10 transform rotate-6 select-none text-right pointer-events-none">
                                <span class="font-headline-xl text-black drop-shadow-[4px_4px_0px_#fff] uppercase">ドォォォォ</span>
                                <div class="font-headline-md text-white bg-black px-4 py-1 mt-2 inline-block skew-x-12">ВРУМММ</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-12 lg:col-span-4 flex flex-col gap-unit-lg">
                    
                    <div class="bg-black text-white p-6 [clip-path:polygon(0_0,100%_10%,95%_100%,5%_90%)] shadow-[8px_8px_0px_0px_#ccc]">
                        <p class="font-label-bold mt-2 text-surface-variant">НАВІГАЦІЯ ПО ДРИФТУ:</p>
                    </div>
                    
                    <div class="grid grid-cols-1 gap-unit-md">
                        <a class="group relative bg-white border-4 border-black p-4 hover:bg-black transition-colors [clip-path:polygon(5%_0,100%_5%,95%_100%,0_95%)]" href="history.html">
                            <div class="flex justify-between items-center group-hover:text-white transition-colors">
                                <span class="font-headline-md italic">ЯК ВИНИК ДРИФТ?</span>
                                <span class="material-symbols-outlined">auto_stories</span>
                            </div>
                        </a>
                        
                        <a class="group relative bg-white border-4 border-black p-4 hover:bg-black transition-colors [clip-path:polygon(2%_10%,98%_0,100%_90%,5%_100%)]" href="techniques.html">
                            <div class="flex justify-between items-center group-hover:text-white transition-colors">
                                <span class="font-headline-md italic">ЯКІ ТЕХНІКИ ДРИФТУ ІСНУЮТЬ?</span>
                                <span class="material-symbols-outlined">psychology</span>
                            </div>
                        </a>
                        
                        <a class="group relative bg-white border-4 border-black p-4 hover:bg-black transition-colors [clip-path:polygon(0_5%,100%_0,92%_100%,8%_95%)]" href="garage.html">
                            <div class="flex justify-between items-center group-hover:text-white transition-colors">
                                <span class="font-headline-md italic">КУЛЬТОВІ АВТО</span>
                                <span class="material-symbols-outlined">construction</span>
                            </div>
                        </a>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <!-- ==================== Footer ==================== -->
    <footer class="flex flex-col md:flex-row justify-between items-center px-10 py-12 w-full bg-black text-white font-headline-md text-xs tracking-widest [clip-path:polygon(0_15%,100%_0,100%_100%,0_100%)] border-t-4 border-white mt-10 z-20 relative">
        <p >
            ©2026 DRIFT_KORS

        <div class="flex gap-8">
